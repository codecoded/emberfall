<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050308">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EMBERFALL Classic</title>
<style>
  html, body { margin: 0; height: 100%; background: #050308; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html.touch body { align-items: flex-start; }
  @media (orientation: landscape) { html.touch body { align-items: center; } }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 384px; height: 216px; --s: 1px; box-shadow: 0 0 0 1px #1a1020, 0 0 60px #000; background: #000; }
  #screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #scan { position: absolute; inset: 0; pointer-events: none; display: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--s) * 0.55), rgba(0,0,0,0.28) calc(var(--s) * 0.55), rgba(0,0,0,0.28) var(--s));
    box-shadow: inset 0 0 calc(var(--s) * 30) rgba(0,0,0,0.45); }
  #stage.crt #scan { display: block; }
  #touch .pause { left: auto !important; margin-left: 0 !important; right: calc(env(safe-area-inset-right) + 1.5vmin); }
  @media (orientation: portrait) { #touch .pause { top: calc(100vw * 0.5625 + 3vmin) !important; } }
  #stage:fullscreen { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="384" height="216"></canvas><div id="scan"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
