<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERFALL Classic</title>
<style>
  html, body { margin: 0; height: 100%; background: #050308; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 384px; height: 216px; --s: 1px; box-shadow: 0 0 0 1px #1a1020, 0 0 60px #000; background: #000; }
  #screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #scan { position: absolute; inset: 0; pointer-events: none; display: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--s) * 0.55), rgba(0,0,0,0.28) calc(var(--s) * 0.55), rgba(0,0,0,0.28) var(--s));
    box-shadow: inset 0 0 calc(var(--s) * 30) rgba(0,0,0,0.45); }
  #stage.crt #scan { display: block; }
  #stage:fullscreen { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="384" height="216"></canvas><div id="scan"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
